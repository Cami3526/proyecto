<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latente - Iniciar Sesión</title>
    <style>
        :root {
            --bg-dark: #0A0908;       
            --surface-card: #13110F;  
            --text-light: #F9F7F5;    
            --text-muted: #9E948A;    
            --fire-orange: #FF5A1F;   
            --fire-gradient: linear-gradient(135deg, #FF7A00 0%, #FF3D00 100%);
            --accent-gold: #E0A96D;   
            --border-subtle: rgba(255, 90, 31, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .login-card {
            background-color: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--fire-gradient);
        }

        .login-card h2 {
            font-size: 2.2rem; font-weight: 800; letter-spacing: 2px;
            background: var(--fire-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 0.2rem;
        }

        .login-card p { color: var(--text-muted); font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2rem; }

        .input-group { text-align: left; margin-bottom: 1.2rem; }

        .input-group label { display: block; font-size: 0.85rem; color: var(--accent-gold); margin-bottom: 0.4rem; font-weight: 600; }

        .input-group input {
            width: 100%; background-color: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px; padding: 0.8rem 1rem; color: var(--text-light); font-size: 1rem; transition: all 0.3s ease;
        }

        .input-group input:focus { outline: none; border-color: var(--fire-orange); background-color: rgba(255, 90, 31, 0.02); }

        #error-msg {
            display: none;
            background-color: rgba(255, 61, 0, 0.15);
            border: 1px solid rgba(255, 61, 0, 0.4);
            color: #FF4D4D;
            font-size: 0.85rem;
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1.2rem;
            text-align: left;
            font-weight: 500;
        }

        .btn-login {
            width: 100%; background: var(--fire-gradient); color: var(--text-light); border: none;
            padding: 0.9rem; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 90, 31, 0.2);
        }

        .btn-login:disabled { background: #4A4540 !important; color: #8A8279 !important; cursor: not-allowed; box-shadow: none; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>LATENTE</h2>
    <p>Boutique Operations OS</p>
    
    <div class="input-group">
        <label>Correo Electrónico</label>
        <input type="email" id="email" placeholder="usuario@latente.com" required>
    </div>

    <div class="input-group">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
    </div>

    <div id="error-msg"></div>

    <button type="button" class="btn-login" id="btn-ingresar">Ingresar al Sistema</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // Credenciales directas de tu proyecto
    const SUPABASE_URL = "https://aypexczsibphswwvyhwr.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5cGV4Y3pzaWJwaHN3d3Z5aHdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5ODQ3MzIsImV4cCI6MjA5NTU2MDczMn0.-Dyvg3BJfIz8P49qE5EW9pilfToCcE2NjHu4KML3yeM";
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const errorMsg = document.getElementById('error-msg');
    const btnIngresar = document.getElementById('btn-ingresar');

    if (btnIngresar) {
        btnIngresar.addEventListener('click', async () => {
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');

            if (!emailInput || !passwordInput) return;

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                mostrarError("Por favor, completa todos los campos.");
                return;
            }

            // Congelar el botón mientras procesa
            btnIngresar.disabled = true;
            btnIngresar.innerText = "Verificando credenciales...";
            if (errorMsg) errorMsg.style.display = 'none';

            try {
                // Intentar el inicio de sesión
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

                if (error) {
                    mostrarError(`Error de acceso: ${error.message}`);
                } else if (data && data.session) {
                    btnIngresar.innerText = "¡Éxito! Entrando...";
                    // Mandar al dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    mostrarError("No se pudo iniciar sesión. Verifica tu cuenta.");
                }
            } catch (err) {
                console.error(err);
                mostrarError(`Error del sistema: ${err.message || err}`);
            }
        });
    }

    function mostrarError(texto) {
        if (errorMsg) {
            errorMsg.innerText = texto;
            errorMsg.style.display = 'block';
        }
        if (btnIngresar) {
            btnIngresar.disabled = false;
            btnIngresar.innerText = "Ingresar al Sistema";
        }
    }
</script>
</body>
</html>

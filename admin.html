<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latente OS - Panel Operativo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('¡Latente OS listo para instalarse!', reg))
                    .catch(err => console.error('Error con el Service Worker', err));
            });
        }
    </script>

    <script>
        const SUPABASE_URL = "https://aypexczsibphswwvyhwr.supabase.co"; 
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5cGV4Y3pzaWJwaHN3d3Z5aHdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5ODQ3MzIsImV4cCI6MjA5NTU2MDczMn0.-Dyvg3BJfIz8P49qE5EW9pilfToCcE2NjHu4KML3yeM";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function verificarSesion() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) {
                    window.location.href = 'login.html';
                }
            } catch (error) {
                console.error("Error validando sesión:", error);
                window.location.href = 'login.html';
            }
        }
        verificarSesion();
    </script>
</head>
<body class="min-h-screen bg-zinc-950 text-white p-8 font-sans">

    <div class="max-w-6xl mx-auto">
        
        <div class="flex justify-between items-center mb-10 border-b border-zinc-800 pb-6">
            <div>
                <span class="text-xs font-semibold tracking-widest text-amber-400 uppercase">Control de Operaciones</span>
                <h1 class="text-3xl font-bold tracking-wide mt-1">Monitoreo de Oficios</h1>
                <p class="text-zinc-400 text-sm mt-1">Asigna tareas de aseo, llaves y jardinería directamente al WhatsApp de tu equipo.</p>
            </div>
            <div class="flex gap-3">
                <a href="dashboard.html" class="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 px-4 py-2 rounded-xl text-sm font-medium transition-all">
                    📋 Ver Dashboard Oscuro
                </a>
                <a href="index.html" class="bg-amber-600 hover:bg-amber-500 text-zinc-950 px-4 py-2 rounded-xl text-sm font-bold transition-all">
                    + Nuevo Registro
                </a>
            </div>
        </div>

        <div id="contenedorHosteles" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div id="mensajeCarga" class="col-span-full text-center py-12 text-zinc-500 animate-pulse text-sm">
                Sincronizando propiedades con la nube...
            </div>
        </div>

    </div>

    <script>
        // Función principal para cargar y pintar las tarjetas desde Supabase
        async function cargarPropiedades() {
            const contenedor = document.getElementById('contenedorHosteles');
            
            try {
                const { data: hosteles, error } = await supabaseClient
                    .from('hosteles')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;

                if (!hosteles || hosteles.length === 0) {
                    contenedor.innerHTML = `
                        <div class="col-span-full text-center py-12 text-zinc-500 text-sm border border-dashed border-zinc-800 rounded-2xl">
                            No se encontraron propiedades registradas.
                        </div>`;
                    return;
                }

                contenedor.innerHTML = '';

                hosteles.forEach(hostel => {
                    const card = document.createElement('div');
                    card.className = "bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-xl relative overflow-hidden flex flex-col justify-between";
                    
                    // Normalizar estados para evitar errores de coincidencia visual
                    const aseo = (hostel.estado_aseo || 'LIMPIO').toUpperCase();
                    const llaves = (hostel.estado_llaves || 'EN OFICINA').toUpperCase();
                    const jardineria = (hostel.estado_jardineria || 'MANTENIDO').toUpperCase();
                    const admin = (hostel.tipo_administracion || 'POR DEFINIR').toUpperCase();

                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h3 class="text-lg font-bold text-zinc-100 tracking-wide">${hostel.nombre || 'Sin Nombre'}</h3>
                                    <p class="text-xs text-amber-500 font-medium mt-0.5">📍 ${hostel.ubicacion || 'Sin ubicación'}</p>
                                </div>
                                <span class="text-xs font-mono font-bold text-zinc-600 bg-zinc-950 border border-zinc-800 px-2 py-0.5 rounded">ID: ${hostel.id}</span>
                            </div>
                            
                            <p class="text-xs text-zinc-400 mb-6">📞 Teléfono Propiedad: ${hostel.telefono || 'No registrado'}</p>
                            
                            <div class="space-y-4 border-t border-zinc-800/60 pt-4 mb-6">
                                <div>
                                    <label class="block text-[11px] font-bold tracking-wider text-zinc-500 uppercase mb-1.5">Control de Aseo</label>
                                    <select onchange="actualizarEstado(${hostel.id}, 'estado_aseo', this.value)" 
                                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs font-medium text-zinc-300 focus:outline-none focus:border-amber-500 transition-all">
                                        <option value="SUCIO" ${aseo === 'SUCIO' ? 'selected' : ''}>❌ SUCIO</option>
                                        <option value="EN PROCESO" ${aseo === 'EN PROCESO' ? 'selected' : ''}>⏳ EN PROCESO</option>
                                        <option value="LIMPIO" ${aseo === 'LIMPIO' ? 'selected' : ''}>✨ LIMPIO</option>
                                    </select>
                                </div>

                                <div>
                                    <label class="block text-[11px] font-bold tracking-wider text-zinc-500 uppercase mb-1.5">Control de Llaves</label>
                                    <select onchange="actualizarEstado(${hostel.id}, 'estado_llaves', this.value)" 
                                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs font-medium text-zinc-300 focus:outline-none focus:border-amber-500 transition-all">
                                        <option value="EN OFICINA" ${llaves === 'EN OFICINA' ? 'selected' : ''}>🏢 EN OFICINA</option>
                                        <option value="CON HUÉSPED" ${llaves === 'CON HUÉSPED' || llaves === 'CON HUESPED' ? 'selected' : ''}>🔑 CON HUÉSPED</option>
                                        <option value="ENTREGADAS ASEO" ${llaves === 'ENTREGADAS ASEO' ? 'selected' : ''}>🧹 ENTREGADAS ASEO</option>
                                        <option value="RECIBIDAS ASEO" ${llaves === 'RECIBIDAS ASEO' ? 'selected' : ''}>📥 RECIBIDAS ASEO</option>
                                    </select>
                                </div>

                                <div>
                                    <label class="block text-[11px] font-bold tracking-wider text-zinc-500 uppercase mb-1.5">Control de Jardinería</label>
                                    <select onchange="actualizarEstado(${hostel.id}, 'estado_jardineria', this.value)" 
                                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs font-medium text-zinc-300 focus:outline-none focus:border-amber-500 transition-all">
                                        <option value="REQUERIDO" ${jardineria === 'REQUERIDO' ? 'selected' : ''}>🍂 REQUERIDO</option>
                                        <option value="EN PROCESO" ${jardineria === 'EN PROCESO' ? 'selected' : ''}>⏳ EN PROCESO</option>
                                        <option value="MANTENIDO" ${jardineria === 'MANTENIDO' ? 'selected' : ''}>🌿 MANTENIDO</option>
                                    </select>
                                </div>

                                <div>
                                    <label class="block text-[11px] font-bold tracking-wider text-zinc-500 uppercase mb-1.5">Esquema Administrativo</label>
                                    <select onchange="actualizarEstado(${hostel.id}, 'tipo_administracion', this.value)" 
                                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs font-medium text-zinc-300 focus:outline-none focus:border-amber-500 transition-all">
                                        <option value="POR DEFINIR" ${admin === 'POR DEFINIR' ? 'selected' : ''}>❓ POR DEFINIR</option>
                                        <option value="COANFITRIONA" ${admin === 'COANFITRIONA' ? 'selected' : ''}>🤝 COANFITRIONA</option>
                                        <option value="SOLO ASEO" ${admin === 'SOLO ASEO' ? 'selected' : ''}>🧹 SOLO ASEO</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="border-t border-zinc-800/60 pt-4 space-y-2">
                            <label class="block text-[10px] font-bold tracking-wider text-amber-500 uppercase">Asignar Responsable</label>
                            
                            <div class="grid grid-cols-2 gap-2">
                                <input type="text" id="nombreOp-${hostel.id}" placeholder="Nombre (Ej. Juan)" 
                                    class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-2.5 py-2 text-xs text-zinc-300 placeholder-zinc-600 focus:outline-none focus:border-amber-500 transition-all">
                                
                                <input type="tel" id="celularOp-${hostel.id}" placeholder="Celular (Ej. 57311...)" 
                                    class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-2.5 py-2 text-xs text-zinc-300 placeholder-zinc-600 focus:outline-none focus:border-amber-500 transition-all">
                            </div>
                            
                            <div class="flex flex-col gap-2 pt-1">
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="enviarWhatsApp(${hostel.id}, '${hostel.nombre}', 'aseo')" 
                                        class="bg-emerald-600 hover:bg-emerald-500 text-zinc-950 py-2 px-3 rounded-xl text-[11px] font-bold transition-all flex items-center justify-center gap-1">
                                        🟢 Mandar Aseo
                                    </button>
                                    <button onclick="enviarWhatsApp(${hostel.id}, '${hostel.nombre}', 'llaves')" 
                                        class="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-200 py-2 px-3 rounded-xl text-[11px] font-bold transition-all flex items-center justify-center gap-1">
                                        🔑 Mandar Llaves
                                    </button>
                                </div>
                                <button onclick="enviarWhatsApp(${hostel.id}, '${hostel.nombre}', 'jardineria')" 
                                    class="bg-amber-600 hover:bg-amber-500 text-zinc-950 py-2 px-3 rounded-xl text-[11px] font-bold transition-all flex items-center justify-center gap-1 w-full">
                                    🌿 Mandar Jardinería
                                </button>
                            </div>
                        </div>
                    `;
                    contenedor.appendChild(card);
                });

            } catch (err) {
                console.error("Error al renderizar panel:", err);
                contenedor.innerHTML = `<div class="col-span-full text-center py-12 text-red-500 text-sm">Error de sincronización de datos.</div>`;
            }
        }

        // Función para inyectar los cambios de estado en tiempo real en Supabase
        async function actualizarEstado(idHostel, columna, nuevoValor) {
            try {
                const datosActualizados = {};
                datosActualizados[columna] = nuevoValor;

                const { data, error } = await supabaseClient
                    .from('hosteles')
                    .update(datosActualizados)
                    .eq('id', idHostel);

                if (error) {
                    console.error(`Error guardando en la columna ${columna}:`, error);
                    alert("No se pudo registrar la actualización en la nube.");
                } else {
                    console.log(`¡Columna ${columna} sincronizada con éxito a: ${nuevoValor}!`);
                }
            } catch (err) {
                console.error("Fallo crítico en la solicitud de cambio:", err);
            }
        }

        // Función para despachar los mensajes personalizados de WhatsApp
        function enviarWhatsApp(idHostel, nombreHostel, tipoMensaje) {
            const inputNombre = document.getElementById(`nombreOp-${idHostel}`);
            const inputCelular = document.getElementById(`celularOp-${idHostel}`);
            
            const nombreOperario = inputNombre ? inputNombre.value.trim() : "";
            let celularOperario = inputCelular ? inputCelular.value.trim() : "";
            
            if (!nombreOperario || !celularOperario) {
                alert("Por favor, ingresa el Nombre y el Celular del operario antes de enviar.");
                return;
            }

            celularOperario = celularOperario.replace(/\s+/g, '').replace('+', '');

            let textoMsg = "";
            if (tipoMensaje === 'aseo') {
                textoMsg = `🧹 *LATENTE OPS - ASIGNACIÓN DE ASEO*\n\nHola *${nombreOperario}*,\nSe te ha asignado el servicio de limpieza para la propiedad:\n🏨 *${nombreHostel}*\n\nPor favor, confírmame cuando vayas en camino. ¡Muchas gracias!`;
            } else if (tipoMensaje === 'llaves') {
                textoMsg = `🔑 *LATENTE OPS - CONTROL DE LLAVES*\n\nHola *${nombreOperario}*,\nEstás a cargo de la gestión de llaves para la propiedad:\n🏨 *${nombreHostel}*\n\nPor favor, mantén el estado actualizado en el sistema.`;
            } else if (tipoMensaje === 'jardineria') {
                // Mensaje personalizado para el área de jardinería
                textoMsg = `🌿 *LATENTE OPS - MANTENIMIENTO DE JARDINERÍA*\n\nHola *${nombreOperario}*,\nSe te ha asignado el mantenimiento de áreas verdes y jardines para la propiedad:\n🏨 *${nombreHostel}*\n\nPor favor, revisa el estado del predio y confírmame al terminar.`;
            }

            const urlWhatsApp = `https://wa.me/${celularOperario}?text=${encodeURIComponent(textoMsg)}`;
            window.open(urlWhatsApp, '_blank');
        }

        // Unificado el trigger de inicio para evitar fallos de carga
        document.addEventListener("DOMContentLoaded", cargarPropiedades);
    </script>
</body>
</html>

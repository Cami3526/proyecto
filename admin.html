                            <button onclick="procesarAccion(${hostel.id}, 'estado_aseo', 'En Proceso', 'selectAseo-${hostel.id}', '${hostel.nombre}')" class="border text-xs py-1.5 rounded-lg transition-all ${btnProcesoClass}">En Proceso</button>

                                ${opcionesLlaves}
                            </select>
                            <button onclick="enviarWhatsAppPersonal('estado_llaves', '${hostel.estado_llaves || 'En Oficina'}', document.getElementById('selectLlaves-${hostel.id}').value, '${hostel.nombre}')" class="bg-[#25D366] hover:bg-[#20ba56] text-zinc-950 font-bold p-2.5 rounded-lg transition-all flex items-center justify-center gap-1 shadow-lg shadow-emerald-950/25" title="Enviar WhatsApp">
                                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.513 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.713-1.457L0 24zm6.59-4.846c1.66.986 3.288 1.488 4.605 1.489 5.425.002 9.832-4.386 9.835-9.81.002-2.628-1.023-5.1-2.885-6.963C16.28 1.945 13.803.921 11.179.921c-5.43 0-9.84 4.393-9.843 9.817a9.75 9.75 0 0 0 1.458 4.542l-1.025 3.744 3.845-.989zm12.39-4.572c-.22-.11-1.298-.64-1.5-.714-.201-.074-.347-.11-.494.11-.146.221-.567.714-.694.86-.127.145-.255.163-.475.052-.221-.11-.932-.343-1.777-1.096-.657-.587-1.101-1.312-1.23-1.531-.13-.22-.013-.339.097-.449.1-.1.22-.256.33-.384.11-.127.147-.219.22-.365.074-.146.037-.274-.018-.384-.056-.11-.494-1.192-.677-1.636-.178-.43-.36-.37-.494-.377-.127-.007-.274-.007-.42-.007-.147 0-.385.055-.587.274-.201.221-.768.75-1.015 1.512-.247.763-.09 1.636.019 1.782.11.146 1.492 2.28 3.615 3.193.504.217.898.347 1.205.445.508.162.97.139 1.336.084.407-.061 1.297-.53 1.48-1.036.182-.505.182-.939.127-1.03-.055-.092-.201-.146-.421-.256z"/>

                            </span>

                            <button onclick="procesarAccion(${hostel.id}, 'estado_llaves', 'Recibidas Aseo', 'selectLlaves-${hostel.id}', '${hostel.nombre}')" class="border text-[10px] py-2 rounded-lg transition-all font-medium overflow-hidden text-center truncate ${btnRecibidasAseo}" title="Llaves Recibidas de Personal de Aseo">📥 De Aseo</button>

            contenedor.appendChild(tarjeta);

        console.error(error);
    }
}
async function procesarAccion(id, columna, nuevoValor, idSelect, nombreHostel) {
            // Obtenemos el teléfono de la persona seleccionada en el menú desplegable
            const telefonoDestinatario = document.getElementById(idSelect).value;

            const urlFila = `${URL_API}?id=eq.${id}`;
            const datosActualizados = {};
            datosActualizados[columna] = nuevoValor;

            try {
                // Actualizamos el estado en Supabase
                const respuesta = await fetch(urlFila, {
                    method: 'PATCH',
                    headers: {
                        'apikey': API_KEY,
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(datosActualizados)
                });

                if (!respuesta.ok) throw new Error("No se pudo actualizar la base de datos");
                
                cargarPanel(); // Refrescamos colores y pantalla en silencio

                // SE ELIMINÓ EL DISPARO AUTOMÁTICO DE AQUÍ PARA QUE SEA MANUAL

            } catch (error) {
                alert("Error: " + error.message);
            }
        }

        function enviarWhatsAppPersonal(tipoServicio, estado, telefono, nombreHostel) {
            let mensaje = "";

            if (tipoServicio === 'estado_aseo') {
                if (estado === 'Sucio') {
                    mensaje = `🛑 *NUEVA TAREA ASIGNADA - GESTIÓN DE ASEO*\n\nHola, tienes asignado un servicio de *Aseo Profundo* urgente.\n\n🏨 Propiedad: *${nombreHostel}*\n📌 Por favor, repórtame por este medio apenas inicies la labor.`;
                } else if (estado === 'En Proceso') {
                    mensaje = `⏳ *SEGUIMIENTO DE ASEO*\n\nHola, confirmo que tu tarea en la propiedad *${nombreHostel}* figura registrada como *En Proceso*.`;
                } else if (estado === 'Limpio') {
                    mensaje = `✅ *CONFORMIDAD DE ASEO*\n\nMuchas gracias. El aseo de la propiedad *${nombreHostel}* ha sido verificado como *Terminado y Conforme*. Buen trabajo! ✨`;
                }
            } else if (tipoServicio === 'estado_llaves') {
                if (estado === 'Entregadas') {
                    mensaje = `🔑 *LOGÍSTICA DE LLAVES*\n\nHola, por favor procede con la *Entrega de Llaves* al huésped programado para la propiedad *${nombreHostel}*.`;
                } else if (estado === 'En Oficina') {
                    mensaje = `🏠 *RETORNO DE LLAVES*\n\nHola, recuerda pasar recogiendo las llaves de la propiedad *${nombreHostel}* y traerlas de vuelta a la *Oficina Principal*.`;
                }
            }

            const enlace = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
            window.open(enlace, '_blank');
        }

        document.addEventListener('DOMContentLoaded', cargarPanel);
    </script>

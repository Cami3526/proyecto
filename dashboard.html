<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latente - Dashboard Operativo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Paleta Latente Fire: Lujo, Fuego y Alta Gama */
        :root {
            --bg-dark: #0A0908;       
            --surface-card: #13110F;  
            --text-light: #F9F7F5;    
            --text-muted: #9E948A;    
            --fire-orange: #FF5A1F;   
            --fire-gradient: linear-gradient(135deg, #FF7A00 0%, #FF3D00 100%);
            --accent-gold: #E0A96D;   
            --border-subtle: rgba(255, 90, 31, 0.08); 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; padding: 2rem; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 2rem; border-bottom: 1px solid var(--border-subtle); margin-bottom: 2rem; }
        
        .logo { font-size: 1.8rem; font-weight: bold; letter-spacing: 1px; }
        .logo span { background: var(--fire-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-top: 0.3rem; }
        
        .btn-refresh { background: transparent; color: var(--accent-gold); border: 1px solid var(--accent-gold); padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.3s ease; }
        .btn-refresh:hover { background: var(--accent-gold); color: var(--bg-dark); }
        
        .grid-hosteles { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
        
        .card { background-color: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); position: relative; overflow: hidden; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--fire-gradient); }
        
        .hostel-name { font-size: 1.3rem; font-weight: 600; margin-bottom: 0.2rem; }
        .hostel-location { font-size: 0.85rem; color: var(--accent-gold); margin-bottom: 0.5rem; }
        .hostel-phone { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem; }
        
        .ops-control { border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 1rem; display: flex; flex-direction: column; gap: 0.8rem; }
        .status-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .status-label { color: var(--text-muted); }
        
        .badge { padding: 0.3rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; background-color: rgba(158, 148, 138, 0.15); color: var(--text-muted); }
        
        .loading, .empty { grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--text-muted); font-style: italic; }
    </style>
</head>
<body>
    <header>
        <div>
            <div class="logo">LATENTE <span>OS</span></div>
            <div class="subtitle">Control Operativo de Propiedades • Alto Ricaute</div>
        </div>
        <button class="btn-refresh" id="btnRefresh">Actualizar Tablero</button>
    </header>

    <main>
        <div class="grid-hosteles" id="contenedorHosteles">
            <div class="loading">Cargando propiedades registradas...</div>
        </div>
    </main>

    <script>
        // Mismas credenciales e identidad que el login
        const SUPABASE_URL = "https://aypexczsibphswwvyhwr.supabase.co"; 
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5cGV4Y3pzaWJwaHN3d3Z5aHdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5ODQ3MzIsImV4cCI6MjA5NTU2MDczMn0.-Dyvg3BJfIz8P49qE5EW9pilfToCcE2NjHu4KML3yeM";
        
        // Usamos EXACTAMENTE la misma variable global
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function cargarDashboard() {
            const contenedor = document.getElementById('contenedorHosteles');
            contenedor.innerHTML = `<div class="loading">Consultando base de datos...</div>`;

            try {
                // Traer datos de la tabla 'hosteles' ordenados por el más reciente
                const { data: hosteles, error } = await supabaseClient
                    .from('hosteles')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;

                if (!hosteles || hosteles.length === 0) {
                    contenedor.innerHTML = `<div class="empty">No hay propiedades registradas todavía.</div>`;
                    return;
                }

                contenedor.innerHTML = '';
                
                // Dibujar cada tarjeta en la interfaz
                hosteles.forEach(hostel => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="hostel-name">${hostel.nombre || 'Sin Nombre'}</div>
                            <div class="hostel-location">📍 ${hostel.ubicacion || 'Sin Ubicación'}</div>
                        </div>
                        <div class="hostel-phone">📞 Tel: ${hostel.telefono || 'No registrado'}</div>
                        <div class="ops-control">
                            <div class="status-row">
                                <span class="status-label">Servicio de Aseo:</span>
                                <span class="badge">${hostel.estado_aseo || 'Por definir'}</span>
                            </div>
                            <div class="status-row">
                                <span class="status-label">Control de Llaves:</span>
                                <span class="badge">${hostel.estado_llaves || 'Por definir'}</span>
                            </div>
                            <div class="status-row">
                                <span class="status-label">Administración:</span>
                                <span class="badge">${hostel.tipo_administracion || 'Por definir'}</span>
                            </div>
                        </div>
                    `;
                    contenedor.appendChild(card);
                });

            } catch (err) {
                console.error("Error en Dashboard:", err);
                contenedor.innerHTML = `<div class="empty" style="color: #ff3d00;">Error de lectura. Si activaste RLS, recuerda añadir la política de SELECT público.</div>`;
            }
        }

        document.getElementById('btnRefresh').addEventListener('click', cargarDashboard);
        window.addEventListener('DOMContentLoaded', cargarDashboard);
    </script>
</body>
</html>
